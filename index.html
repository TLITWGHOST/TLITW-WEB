<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ᵀᴸᴵᵀᵂ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
        }

        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1544829099-b9a0c07fad1a?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            filter: brightness(0.55);
            transform: scale(1.05);
            animation: subtleZoom 20s infinite alternate;
        }

        @keyframes subtleZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
            padding: 20px;
        }

        .top-title {
            position: absolute;
            top: 25px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .content-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .label-top {
            color: #fff;
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: 500;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        .apple-button {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            padding: 16px 45px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .apple-button:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .apple-button:active {
            transform: translateY(1px);
        }

        .label-bottom {
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
            margin-top: 15px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        .profile-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }

        .profile-circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s ease;
        }

        .profile-circle:hover {
            transform: scale(1.05);
        }

        .profile-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .profile-placeholder {
            color: #fff;
            font-size: 18px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: rgba(30, 30, 30, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 30px;
            width: 85%;
            max-width: 340px;
            text-align: center;
            color: #fff;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 15px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255,255,255,0.1);
        }

        .modal-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-info {
            margin-bottom: 20px;
        }

        .modal-info h3 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .modal-info p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin: 4px 0;
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 12px;
            padding: 10px 25px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="background"></div>

    <div class="profile-container">
        <div class="profile-circle" id="profileBtn" onclick="toggleModal(true)">
            <span class="profile-placeholder" id="profilePlaceholder">👤</span>
            <img id="profileImg" src="" alt="Profile">
        </div>
    </div>

    <div class="container">
        <div class="top-title">ᵀᴸᴵᵀᵂ</div>
        
        <div class="content-box">
            <div class="label-top">Channel</div>
            <a href="https://t.me/Arsham_Ghost_B" target="_blank" class="apple-button">Channel</a>
            <div class="label-bottom">Coming Soon</div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="handleModalOutside(event)">
        <div class="modal-card">
            <div class="modal-avatar">
                <span id="modalPlaceholder">👤</span>
                <img id="modalImg" src="" alt="Profile">
            </div>
            <div class="modal-info">
                <h3 id="userName">Guest User</h3>
                <p id="userUsername">@Guest</p>
                <p id="userId">ID: ---</p>
            </div>
            <button class="modal-close" onclick="toggleModal(false)">Close</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const modalOverlay = document.getElementById('modalOverlay');
        const profileImg = document.getElementById('profileImg');
        const profilePlaceholder = document.getElementById('profilePlaceholder');
        const modalImg = document.getElementById('modalImg');
        const modalPlaceholder = document.getElementById('modalPlaceholder');
        const userNameElem = document.getElementById('userName');
        const userUsernameElem = document.getElementById('userUsername');
        const userIdElem = document.getElementById('userId');

        function initTelegramUser() {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe) {
                const tgUser = window.Telegram.WebApp.initDataUnsafe.user;
                if (tgUser) {
                    const firstName = tgUser.first_name || '';
                    const lastName = tgUser.last_name || '';
                    const fullName = (firstName + ' ' + lastName).trim() || 'Telegram User';
                    const username = tgUser.username ? '@' + tgUser.username : 'No Username';
                    const id = tgUser.id || '---';

                    userNameElem.textContent = fullName;
                    userUsernameElem.textContent = username;
                    userIdElem.textContent = 'ID: ' + id;

                    if (tgUser.photo_url) {
                        profileImg.src = tgUser.photo_url;
                        profileImg.style.display = 'block';
                        profilePlaceholder.style.display = 'none';

                        modalImg.src = tgUser.photo_url;
                        modalImg.style.display = 'block';
                        modalPlaceholder.style.display = 'none';
                    }
                }
            }
        }

        function toggleModal(show) {
            if (show) {
                modalOverlay.classList.add('active');
            } else {
                modalOverlay.classList.remove('active');
            }
        }

        function handleModalOutside(event) {
            if (event.target === modalOverlay) {
                toggleModal(false);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
            initTelegramUser();
        });
    </script>
</body>
</html>
